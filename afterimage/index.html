<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afterimage Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Darkroom palette: a photo editor stays dark on purpose so colors are judged against black. */
  :root {
    color-scheme: dark;
    --ink: #0d0c11;
    --panel: #15131a;
    --raise: #1e1b25;
    --line: #2c2834;
    --text: #efe9df;
    --mute: #958d9f;
    --safelight: #f2b24a;
    --safelight-ink: #1a1206;
    --bar: 60px;
    --display: "Syne", "Arial Black", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font: 14px/1.45 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--safelight); outline-offset: 2px; }

  .bar {
    min-height: var(--bar);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px 16px;
    padding-block: 10px; padding-inline: 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .mark {
    font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em;
    background: linear-gradient(90deg, #e3241b 0%, #f6d31a 38%, #efe9df 60%, #3a4bff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-family: var(--mono); font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .08em; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--raise); color: var(--text);
    font-weight: 500; font-size: 13px; cursor: pointer; user-select: none;
    transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: #4a4454; }
  .btn.primary { background: var(--safelight); color: var(--safelight-ink); border-color: var(--safelight); font-weight: 600; }
  .btn.primary:hover { background: #ffc566; }
  .btn.ghost { background: transparent; height: 28px; padding: 0 10px; font-size: 12px; }
  .btn.small { height: 28px; padding: 0 10px; font-size: 12px; }
  input[type=file] { display: none; }

  .app { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr) 372px; height: calc(100% - var(--bar)); }
    .panel { overflow-y: auto; border-left: 1px solid var(--line); }
  }

  .stage {
    position: relative;
    display: flex; flex-direction: column; min-height: 0;
    padding: 16px;
    background:
      radial-gradient(circle at 50% 40%, #1a1720 0%, var(--ink) 70%);
  }
  .canvas-wrap { flex: 1; min-height: 0; display: grid; place-items: center; }
  #view {
    display: block; max-width: 100%; max-height: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    touch-action: none; cursor: crosshair;
  }
  @media (max-width: 899px) { #view { max-height: 70vh; } }
  .stage-foot {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    padding-top: 12px;
  }
  .mono { font-family: var(--mono); font-size: 11px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .drop {
    position: absolute; inset: 10px; border: 2px dashed var(--safelight); border-radius: 10px;
    display: grid; place-items: center; background: rgba(13,12,17,.8);
    font-family: var(--display); font-size: 24px; color: var(--safelight); pointer-events: none;
  }
  .comparing-tag {
    position: absolute; top: 24px; left: 24px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    background: var(--text); color: var(--ink); padding: 3px 8px; border-radius: 3px;
  }

  .panel { background: var(--panel); padding-block: 16px 40px; padding-inline: 16px; display: flex; flex-direction: column; gap: 22px; }
  .eyebrow {
    margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline;
    font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute);
  }
  .eyebrow span { letter-spacing: .02em; text-transform: none; font-weight: 400; }

  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .preset {
    display: flex; flex-direction: column; gap: 5px; padding: 0; border: 0; background: none; cursor: pointer; text-align: left;
  }
  .preset canvas {
    width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; border-radius: 4px;
    border: 2px solid transparent; background: var(--raise);
  }
  .preset[aria-pressed="true"] canvas { border-color: var(--safelight); }
  .preset:hover canvas { border-color: #4a4454; }
  .preset[aria-pressed="true"]:hover canvas { border-color: var(--safelight); }
  .preset span { font-size: 12px; font-weight: 500; line-height: 1.2; }

  .fx { border-top: 1px solid var(--line); }
  .fx:last-child { border-bottom: 1px solid var(--line); }
  .fx-head { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
  .fx-title { display: flex; flex-direction: column; min-width: 0; }
  .fx-name { font-weight: 600; font-size: 14px; }
  .fx-hint { font-size: 12px; color: var(--mute); }
  .fx.off .fx-name { color: var(--mute); }
  .fx-body { display: grid; gap: 12px; padding: 2px 0 16px 46px; }

  .switch { position: relative; width: 34px; height: 20px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 10px; background: var(--line); transition: background .15s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--mute); transition: transform .15s, background .15s; }
  .switch input:checked + span { background: var(--safelight); }
  .switch input:checked + span::after { transform: translateX(14px); background: var(--safelight-ink); }
  .switch input:focus-visible + span { outline: 2px solid var(--safelight); outline-offset: 2px; }

  .ctl { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
  .ctl label { font-size: 12px; color: #cfc8d6; }
  .ctl output { font-family: var(--mono); font-size: 11px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .ctl input[type=range], .ctl select, .ctl .seg { grid-column: 1 / -1; }
  input[type=range] { width: 100%; accent-color: var(--safelight); height: 18px; margin: 0; }
  select {
    width: 100%; height: 30px; padding: 0 8px; border-radius: 5px;
    background: var(--raise); border: 1px solid var(--line);
  }
  .swatches { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .swatch {
    display: flex; flex-direction: column; gap: 3px; padding: 0; border: 0; background: none; cursor: pointer; text-align: left;
    font-size: 11px; color: var(--mute);
  }
  .swatch i { display: block; height: 14px; border-radius: 3px; border: 2px solid transparent; }
  .swatch[aria-pressed="true"] { color: var(--text); }
  .swatch[aria-pressed="true"] i { border-color: var(--text); }
  .blend-src { display: flex; align-items: center; gap: 10px; }
  .blend-src canvas { width: 54px; height: 40px; border-radius: 3px; object-fit: cover; background: var(--raise); }
  .check { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #cfc8d6; grid-column: 1 / -1; }
  .check input { accent-color: var(--safelight); margin: 0; }

  dialog {
    max-width: min(720px, calc(100vw - 32px)); width: 100%;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 18px;
  }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  dialog h3 { margin: 0 0 4px; font-family: var(--display); font-size: 20px; }
  dialog p { margin: 0 0 12px; color: var(--mute); font-size: 13px; max-width: 60ch; }
  dialog img { display: block; width: 100%; height: auto; max-height: 60vh; object-fit: contain; background: #000; border-radius: 4px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--text); color: var(--ink); padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
    max-width: calc(100vw - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 10;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="mark">Afterimage</span>
    <span class="sub">photo → artwork</span>
  </div>
  <div class="actions">
    <label class="btn primary" for="file1">Open photo</label>
    <input type="file" id="file1" accept="image/*">
    <input type="file" id="file2" accept="image/*">
    <button class="btn" id="surprise" type="button">Surprise me</button>
    <button class="btn" id="save" type="button">Save image</button>
  </div>
</header>

<main class="app">
  <section class="stage" id="stage">
    <div class="canvas-wrap"><canvas id="view" aria-label="Edited photo"></canvas></div>
    <div class="stage-foot">
      <span id="meta" class="mono"></span>
      <button id="compare" class="btn ghost" type="button">Hold to see original</button>
    </div>
    <div class="drop" id="drop" hidden>Drop photo to open</div>
    <div class="comparing-tag" id="compTag" hidden>Original</div>
  </section>

  <aside class="panel">
    <div>
      <h2 class="eyebrow">Recipes <span>tap to apply, then tweak</span></h2>
      <div class="presets" id="presets"></div>
    </div>
    <div>
      <h2 class="eyebrow">Effect stack <span>runs top to bottom</span></h2>
      <div id="stack"></div>
    </div>
  </aside>
</main>

<dialog id="saveDlg">
  <h3>Your artwork</h3>
  <p id="saveNote">The download should start on its own. If it doesn't, right-click the image (or long-press on a phone) and choose Save Image.</p>
  <img id="saveImg" alt="Finished artwork at full size">
  <div class="dlg-actions"><button class="btn" id="closeDlg" type="button">Close</button></div>
</dialog>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ---------- palettes for the color map ---------- */
const PALETTES = {
  popeye:   { name: 'Pop Eye',   stops: ['#050505', '#1b2bd6', '#e3241b', '#f6d31a', '#ffffff'] },
  dusk:     { name: 'Neon Dusk', stops: ['#07030f', '#3a0f6b', '#c2317a', '#f39a4a', '#fff1c9'] },
  sodium:   { name: 'Sodium',    stops: ['#000000', '#2a0f06', '#9a3b12', '#e89a4a', '#fff3dc'] },
  cyano:    { name: 'Cyanotype', stops: ['#02060f', '#0b2a5c', '#2d7fb8', '#9fd8ef', '#ffffff'] },
  acid:     { name: 'Acid',      stops: ['#000000', '#0b4d2a', '#28d17c', '#e8ff5a', '#ffffff'] },
  infrared: { name: 'Infrared',  stops: ['#000000', '#3b0020', '#ff1f5a', '#ffb3c7', '#ffffff'] },
};

/* ---------- effect schema: drives UI, defaults, randomizer ---------- */
const FX = [
  { key: 'adjust', name: 'Tone', hint: 'Contrast, color and crushed blacks', c: [
    { k: 'brightness', label: 'Brightness', min: -100, max: 100, v: 0 },
    { k: 'contrast',   label: 'Contrast',   min: -100, max: 100, v: 0 },
    { k: 'saturation', label: 'Saturation', min: 0, max: 300, v: 100, unit: '%' },
    { k: 'hue',        label: 'Hue shift',  min: -180, max: 180, v: 0, unit: '°' },
    { k: 'black',      label: 'Crush blacks', min: 0, max: 100, v: 0 },
  ]},
  { key: 'expose', name: 'Double exposure', hint: 'Layer a second photo into the first', c: [
    { k: 'source', type: 'source' },
    { k: 'mode', label: 'Blend', type: 'select', v: 'screen', opts: [['screen','Screen (lighten)'],['lighten','Lighten'],['overlay','Overlay'],['multiply','Multiply (darken)'],['difference','Difference (psychedelic)'],['darken','Darken']] },
    { k: 'mask', label: 'Where it shows', type: 'select', v: 'full', opts: [['full','Whole frame'],['shadows','Inside the shadows'],['highlights','Inside the highlights'],['window','A glowing window']] },
    { k: 'opacity',  label: 'Strength', min: 0, max: 100, v: 80, unit: '%' },
    { k: 'scale',    label: 'Zoom second photo', min: 100, max: 300, v: 100, unit: '%' },
    { k: 'winSize',  label: 'Window size', min: 15, max: 90, v: 45, unit: '%', when: s => s.mask === 'window' },
    { k: 'winX',     label: 'Window position', min: 0, max: 100, v: 30, unit: '%', when: s => s.mask === 'window' },
    { k: 'surround', label: 'Darken outside window', min: 0, max: 100, v: 60, unit: '%', when: s => s.mask === 'window' },
  ]},
  { key: 'solar', name: 'Solarize', hint: 'Flip the brightest tones, like light hitting a print mid-develop', c: [
    { k: 'threshold', label: 'Flip above', min: 0, max: 255, v: 128 },
    { k: 'mix',       label: 'Strength',   min: 0, max: 100, v: 100, unit: '%' },
  ]},
  { key: 'poster', name: 'Posterize', hint: 'Snap colors into flat bands', c: [
    { k: 'levels', label: 'Levels per channel', min: 2, max: 10, v: 3 },
    { k: 'mix',    label: 'Strength', min: 0, max: 100, v: 100, unit: '%' },
  ]},
  { key: 'gmap', name: 'Color map', hint: 'Repaint shadows to highlights with a palette', c: [
    { k: 'palette', type: 'palette', v: 'popeye' },
    { k: 'amount',  label: 'Strength', min: 0, max: 100, v: 60, unit: '%' },
    { k: 'hard',    label: 'Hard edges between colors', type: 'check', v: true },
  ]},
  { key: 'streak', name: 'Pixel streak', hint: 'Drag pixels into long lines of light', c: [
    { k: 'style', label: 'Style', type: 'select', v: 'smear', opts: [['smear','Smear (stretched pixels)'],['trails','Light trails (glowing drips)']] },
    { k: 'dir',   label: 'Direction', type: 'select', v: 'down', opts: [['down','Downward'],['up','Upward'],['right','Sideways']] },
    { k: 'length',   label: 'Length', min: 1, max: 100, v: 55, unit: '%' },
    { k: 'coverage', label: 'How many lines', min: 0, max: 100, v: 85, unit: '%' },
    { k: 'span',     label: 'Reach across frame', min: 5, max: 100, v: 100, unit: '%' },
    { k: 'threshold', label: 'Only from pixels brighter than', min: 0, max: 255, v: 40 },
    { k: 'fibers',   label: 'Line texture', min: 0, max: 100, v: 40, unit: '%' },
    { k: 'mix',      label: 'Strength', min: 0, max: 100, v: 90, unit: '%' },
  ]},
  { key: 'glitch', name: 'Glitch', hint: 'Split color channels and slip slices', c: [
    { k: 'shift',    label: 'Color split', min: 0, max: 40, v: 8 },
    { k: 'slices',   label: 'Slices', min: 0, max: 40, v: 10 },
    { k: 'displace', label: 'Slice slip', min: 0, max: 100, v: 30, unit: '%' },
  ]},
  { key: 'finish', name: 'Finish', hint: 'Vignette and film grain', c: [
    { k: 'vignette', label: 'Vignette', min: 0, max: 100, v: 35, unit: '%' },
    { k: 'grain',    label: 'Grain', min: 0, max: 100, v: 10, unit: '%' },
  ]},
];

function defaults() {
  const s = { seed: 7 };
  for (const fx of FX) {
    s[fx.key] = { on: false };
    for (const c of fx.c) if (c.type !== 'source') s[fx.key][c.k] = c.v;
  }
  return s;
}
function withPreset(p) {
  const s = defaults();
  for (const k in p) {
    if (k === 'seed') s.seed = p.seed;
    else Object.assign(s[k], { on: true }, p[k]);
  }
  return s;
}

/* ---------- recipes, modelled on the three reference pieces ---------- */
const PRESETS = [
  { id: 'popeye', name: 'Pop Eye', p: {
    adjust: { contrast: 55, saturation: 230, black: 20, brightness: 5 },
    poster: { levels: 3, mix: 100 },
    gmap: { palette: 'popeye', amount: 35, hard: true },
    finish: { vignette: 0, grain: 4 },
  }},
  { id: 'window', name: 'Window Glow', p: {
    adjust: { contrast: 30, saturation: 120, black: 45, brightness: -20 },
    expose: { mode: 'screen', mask: 'window', opacity: 100, winSize: 45, winX: 25, surround: 78, scale: 110 },
    gmap: { palette: 'dusk', amount: 20, hard: false },
    finish: { vignette: 55, grain: 8 },
  }},
  { id: 'rain', name: 'Light Rain', p: {
    adjust: { contrast: 35, saturation: 80, black: 12, brightness: 0 },
    streak: { style: 'smear', dir: 'down', length: 70, coverage: 90, span: 60, threshold: 25, fibers: 60, mix: 95 },
    gmap: { palette: 'sodium', amount: 35, hard: false },
    finish: { vignette: 30, grain: 12 },
  }},
  { id: 'sabattier', name: 'Sabattier', p: {
    adjust: { contrast: 40, saturation: 60 },
    solar: { threshold: 120, mix: 100 },
    gmap: { palette: 'cyano', amount: 70, hard: false },
    finish: { vignette: 30, grain: 14 },
  }},
  { id: 'ghost', name: 'Ghost Signal', p: {
    adjust: { contrast: 45, saturation: 180 },
    expose: { mode: 'difference', mask: 'shadows', opacity: 70, scale: 130 },
    poster: { levels: 4, mix: 100 },
    glitch: { shift: 12, slices: 14, displace: 40 },
  }},
  { id: 'infrared', name: 'Infrared Drip', p: {
    adjust: { contrast: 35, saturation: 140 },
    expose: { mode: 'lighten', mask: 'full', opacity: 55, scale: 100 },
    streak: { style: 'trails', dir: 'down', length: 35, coverage: 55, span: 100, threshold: 150, fibers: 30, mix: 100 },
    gmap: { palette: 'infrared', amount: 75, hard: false },
    finish: { vignette: 40, grain: 6 },
  }},
];

let state = withPreset(PRESETS[0].p);
let activePreset = PRESETS[0].id;

/* ---------- images ---------- */
let primary = null;   // HTMLCanvasElement or HTMLImageElement
let second = null;
let primaryId = 0, secondId = 0;
const WORK_MAX = 1400, EXPORT_MAX = 3200, THUMB_W = 180;

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function dims(img) { return [img.naturalWidth || img.width, img.naturalHeight || img.height]; }
function fitSize(img, max) {
  const [w, h] = dims(img); const s = Math.min(1, max / Math.max(w, h));
  return [Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s))];
}

// seeded helpers so random effects stay put while you drag sliders
function hash(n, seed) {
  let t = Math.imul(n | 0, 374761393) + Math.imul(seed | 0, 668265263) | 0;
  t = Math.imul(t ^ (t >>> 13), 1274126177);
  t ^= t >>> 16;
  return (t >>> 0) / 4294967296;
}
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* ---------- sample photos, painted procedurally so the app opens with something to edit ---------- */
function paintCity(w, h) {
  const c = mkCanvas(w, h), g = c.getContext('2d'), r = rng(42);
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#0b0a2a'); sky.addColorStop(0.35, '#3b1f6b');
  sky.addColorStop(0.58, '#c2542d'); sky.addColorStop(0.7, '#f3a34b');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  // far skyline
  g.fillStyle = '#2a1c4a';
  for (let x = 0; x < w;) { const bw = 30 + r() * 70, bh = h * (0.25 + r() * 0.3); g.fillRect(x, h * 0.72 - bh, bw, bh + h); x += bw + 2; }
  // near buildings with windows
  for (let x = -20; x < w;) {
    const bw = 70 + r() * 150, bh = h * (0.3 + r() * 0.45), top = h - bh;
    g.fillStyle = r() < 0.2 ? '#141a33' : '#0c0a14'; g.fillRect(x, top, bw, bh);
    const lit = 0.25 + r() * 0.35, cols = ['#ffcf6b', '#ffe9b0', '#7fd6ff', '#ff9a4a', '#ffffff'];
    for (let wy = top + 10; wy < h - 20; wy += 16) for (let wx = x + 8; wx < x + bw - 10; wx += 13) {
      if (r() < lit) { g.fillStyle = cols[(r() * cols.length) | 0]; g.globalAlpha = 0.6 + r() * 0.4; g.fillRect(wx, wy, 7, 9); }
    }
    g.globalAlpha = 1; x += bw + 6 + r() * 20;
  }
  // glass tower reflecting the sky
  const tx = w * 0.62, tw = w * 0.12, tt = h * 0.18;
  const gl = g.createLinearGradient(tx, tt, tx + tw, h);
  gl.addColorStop(0, '#6a8cff'); gl.addColorStop(0.5, '#e07a9a'); gl.addColorStop(1, '#1a1030');
  g.fillStyle = gl; g.fillRect(tx, tt, tw, h - tt);
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1;
  for (let y = tt; y < h; y += 14) { g.beginPath(); g.moveTo(tx, y); g.lineTo(tx + tw, y); g.stroke(); }
  for (let x = tx; x < tx + tw; x += 18) { g.beginPath(); g.moveTo(x, tt); g.lineTo(x, h); g.stroke(); }

  Object.assign(s.adjust, { on: true, contrast: 15 + (R() * 55 | 0), saturation: 70 + (R() * 170 | 0), brightness: -20 + (R() * 25 | 0), hue: R() < 0.3 ? (R() * 360 - 180 | 0) : 0, black: R() * 45 | 0 });
  const pool = ['expose', 'solar', 'poster', 'gmap', 'streak', 'glitch'].sort(() => R() - 0.5);
  pool.slice(0, 2 + (R() < 0.5 ? 1 : 0)).forEach(randomize);
  if (s.solar.on) s.solar.threshold = 90 + (R() * 110 | 0);
  if (s.poster.on) s.poster.levels = 2 + (R() * 4 | 0);
  if (s.gmap.on) s.gmap.amount = 30 + (R() * 70 | 0);
  if (s.expose.on) s.expose.opacity = 50 + (R() * 50 | 0);
  if (s.glitch.on) s.glitch.shift = R() * 20 | 0;
  Object.assign(s.finish, { on: true, vignette: R() * 60 | 0, grain: R() * 18 | 0 });
  state = s; activePreset = null; syncUI(); schedule();
}

/* ---------- files ---------- */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3200);
}
function loadFile(file, which) {
  if (!file) return;
  if (!file.type.startsWith('image/') && !/\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(file.name)) { toast('That file isn’t an image. Try a JPG or PNG.'); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    // keep a capped copy so huge phone photos stay fast
    const [w, h] = fitSize(img, EXPORT_MAX), c = mkCanvas(w, h);
    c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
    if (which === 2) { second = c; secondId++; state.expose.on = true; markCustom(); syncUI(); toast('Second photo loaded into Double exposure.'); }
    else { primary = c; primaryId++; drawThumbs(); toast('Photo opened. Pick a recipe or build your own stack.'); }
    schedule();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('This browser can’t read that image. Convert it to JPG or PNG and try again.'); };
  img.src = url;
}
$('#file1').addEventListener('change', e => { loadFile(e.target.files[0], 1); e.target.value = ''; });
$('#file2').addEventListener('change', e => { loadFile(e.target.files[0], 2); e.target.value = ''; });

const stage = $('#stage');
['dragenter', 'dragover'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); $('#drop').hidden = false; }));
['dragleave', 'drop'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); if (ev === 'dragleave' && stage.contains(e.relatedTarget)) return; $('#drop').hidden = true; }));
stage.addEventListener('drop', e => loadFile(e.dataTransfer.files[0], 1));

/* compare: hold on the button or the image */
function setOriginal(on) { showingOriginal = on; $('#compTag').hidden = !on; schedule(); }
for (const el of [$('#compare'), view]) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); setOriginal(true); });
  el.addEventListener('pointerup', () => setOriginal(false));
  el.addEventListener('pointerleave', () => showingOriginal && setOriginal(false));
  el.addEventListener('pointercancel', () => setOriginal(false));
}
$('#compare').addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setOriginal(true); } });
$('#compare').addEventListener('keyup', () => setOriginal(false));

/* save at full size */
$('#save').addEventListener('click', () => {
  if (!primary) return;
  const btn = $('#save'); btn.textContent = 'Rendering…'; btn.disabled = true;
  setTimeout(() => {
    const [W, H] = fitSize(primary, EXPORT_MAX), c = mkCanvas(W, H);
    c.getContext('2d').putImageData(processImage(state, W, H), 0, 0);
    c.toBlob(blob => {
      btn.textContent = 'Save image'; btn.disabled = false;
      if (!blob) { toast('Couldn’t render the image. Try a smaller photo.'); return; }
      const filename = `afterimage-${Date.now()}.png`;
      if (downloads) {
        downloads.save({ filename, data: blob })
          .then(() => toast(`Saved ${W} × ${H} px PNG.`))
          .catch(err => { if (err && err.code === 'declined') toast('Save cancelled.'); else showSaved(blob, W, H, filename); });
      } else showSaved(blob, W, H, filename);
    }, 'image/png');
  }, 30);
});
function showSaved(blob, W, H, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  $('#saveImg').src = url;
  $('#saveNote').textContent = `${W} × ${H} px PNG. If the download didn’t start, right-click the image (or long-press on a phone) and choose Save Image.`;
  $('#saveDlg').showModal();
}
// When hosted as a Claude artifact, saving goes through the viewer's download prompt.
let downloads = null;
if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
$('#closeDlg').addEventListener('click', () => $('#saveDlg').close());
$('#surprise').addEventListener('click', surprise);

/* ---------- boot ---------- */
buildPresets();
buildStack();
primary = paintCity(1400, 1000); primaryId++;
second = paintDusk(1200, 900); secondId++;
syncUI();
draw();
drawThumbs();
})();
</script>
</body>
