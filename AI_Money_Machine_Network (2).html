<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Money Machine — Network Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #08111E;
    font-family: 'Segoe UI', 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 28px;
    min-height: 100vh;
  }
  #title { font-size: 22px; font-weight: 800; color: #F6AE2D; letter-spacing: -0.3px; text-align: center; }
  #subtitle { font-size: 11px; color: #7A9CB8; margin-top: 4px; text-align: center; }
  #legend {
    display: flex; gap: 8px; margin: 12px 0 10px;
    flex-wrap: wrap; justify-content: center;
  }
  .leg-btn {
    background: transparent; border-radius: 20px; padding: 4px 13px;
    cursor: pointer; font-size: 11px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    font-family: inherit; transition: background .15s;
  }
  .leg-dash { display: inline-block; width: 20px; height: 3px; border-radius: 2px; }
  #clear-btn {
    background: #1B3A52; border: 1.5px solid #7A9CB8; border-radius: 20px;
    padding: 4px 13px; cursor: pointer; color: #7A9CB8;
    font-size: 11px; font-family: inherit; display: none;
  }
  #canvas-wrap { position: relative; }
  #hint {
    position: absolute; bottom: 8px; left: 14px;
    font-size: 10px; color: #3A5E78; font-style: italic;
    pointer-events: none;
  }
  #stats {
    display: flex; gap: 14px; margin-top: 12px;
    flex-wrap: wrap; justify-content: center;
  }
  .stat-card {
    text-align: center; background: #0D2035;
    border-radius: 8px; padding: 7px 16px;
  }
  .stat-val { font-size: 18px; font-weight: 800; }
  .stat-lbl { font-size: 9px; color: #7A9CB8; margin-top: 2px; }
</style>
</head>
<body>

<div id="title">How Nvidia and OpenAI Fuel the AI Money Machine</div>
<div id="subtitle">Sep 2025 – Mar 2026 &nbsp;·&nbsp; Bloomberg, CNBC, Nvidia/OpenAI press releases &nbsp;·&nbsp; Click nodes to highlight &nbsp;·&nbsp; Hover edges for amounts</div>

<div id="legend"></div>

<div id="canvas-wrap">
  <svg id="net" style="display:block;overflow:visible;"></svg>
  <div id="hint">Circles sized by market value</div>
</div>

<div id="stats"></div>

<script>
const W = 920, H = 800;
const CX = W / 2, CY = H / 2 - 10;

document.getElementById("net").setAttribute("width", W);
document.getElementById("net").setAttribute("height", H);

const NODES = [
  {id:"MSFT",     label:"Microsoft",   sub:"$3.9T",  cap:3900, sector:"Hyperscaler",    angle:90,  r:192},
  {id:"OPENAI",   label:"OpenAI",      sub:"$840B",  cap:840,  sector:"Foundation Lab", angle:152, r:192},
  {id:"NVDA",     label:"Nvidia",      sub:"$4.5T",  cap:4500, sector:"Chipmaker",      angle:270, r:0},
  {id:"AMD",      label:"AMD",         sub:"~$200B", cap:200,  sector:"Chipmaker",      angle:218, r:265},
  {id:"ORACLE",   label:"Oracle",      sub:"~$500B", cap:500,  sector:"Cloud/Infra",    angle:20,  r:265},
  {id:"CRWV",     label:"CoreWeave",   sub:"~$70B",  cap:70,   sector:"AI Cloud",       angle:44,  r:208},
  {id:"INTC",     label:"Intel",       sub:"~$100B", cap:100,  sector:"Chipmaker",      angle:336, r:218},
  {id:"NEBIUS",   label:"Nebius",      sub:"~$15B",  cap:15,   sector:"AI Cloud",       angle:112, r:208},
  {id:"NSCALE",   label:"Nscale",      sub:"~$14B",  cap:14,   sector:"AI Cloud",       angle:230, r:238},
  {id:"MISTRAL",  label:"Mistral AI",  sub:"~$14B",  cap:14,   sector:"Foundation Lab", angle:246, r:265},
  {id:"FIG",      label:"Figure AI",   sub:"$39B",   cap:39,   sector:"Robotics",       angle:262, r:300},
  {id:"XAI",      label:"xAI",         sub:"$230B",  cap:230,  sector:"Foundation Lab", angle:282, r:278},
  {id:"HARVEY",   label:"Harvey AI",   sub:"$8B",    cap:8,    sector:"Vertical AI",    angle:168, r:238},
  {id:"CURSOR",   label:"Anysphere",   sub:"$29B",   cap:29,   sector:"Dev Tools",      angle:183, r:238},
  {id:"AMBIENCE", label:"Ambience",    sub:"$1.25B", cap:1,    sector:"Health AI",      angle:138, r:265},
  {id:"ANTHROPIC",label:"Anthropic",   sub:"$380B",  cap:380,  sector:"Foundation Lab", angle:70,  r:218},
];

const EDGES = [
  {src:"NVDA",     tgt:"OPENAI",    type:"Investment",          label:"$30B equity"},
  {src:"NVDA",     tgt:"CRWV",      type:"Investment",          label:"$2B equity"},
  {src:"NVDA",     tgt:"NEBIUS",    type:"Investment",          label:"$2B equity"},
  {src:"NVDA",     tgt:"NSCALE",    type:"Investment",          label:"£500M"},
  {src:"NVDA",     tgt:"MISTRAL",   type:"Investment",          label:"VC participation"},
  {src:"NVDA",     tgt:"FIG",       type:"Venture Capital",     label:"VC participation"},
  {src:"NVDA",     tgt:"XAI",       type:"Investment",          label:"≤$2B equity"},
  {src:"NVDA",     tgt:"INTC",      type:"Investment",          label:"$5B equity"},
  {src:"NVDA",     tgt:"ANTHROPIC", type:"Investment",          label:"≤$10B equity"},
  {src:"OPENAI",   tgt:"ORACLE",    type:"Services",            label:"$300B cloud deal"},
  {src:"ORACLE",   tgt:"NVDA",      type:"Hardware or Software",label:"~$40B GPUs"},
  {src:"OPENAI",   tgt:"CRWV",      type:"Services",            label:"$22.4B cloud"},
  {src:"AMD",      tgt:"OPENAI",    type:"Hardware or Software",label:"6GW GPU supply"},
  {src:"OPENAI",   tgt:"AMD",       type:"Venture Capital",     label:"160M share warrants"},
  {src:"MSFT",     tgt:"OPENAI",    type:"Investment",          label:"$13B equity"},
  {src:"MSFT",     tgt:"CRWV",      type:"Services",            label:"~$10B cloud"},
  {src:"MSFT",     tgt:"NEBIUS",    type:"Services",            label:"~$18B cloud"},
  {src:"MSFT",     tgt:"ANTHROPIC", type:"Investment",          label:"$5B equity"},
  {src:"OPENAI",   tgt:"HARVEY",    type:"Venture Capital",     label:"Seed → Series E"},
  {src:"OPENAI",   tgt:"CURSOR",    type:"Venture Capital",     label:"$8M seed"},
  {src:"OPENAI",   tgt:"AMBIENCE",  type:"Venture Capital",     label:"Co-led Series B+C"},
  {src:"XAI",      tgt:"NVDA",      type:"Hardware or Software",label:"GPU purchases"},
  {src:"ANTHROPIC",tgt:"MSFT",      type:"Services",            label:"$30B Azure commit"},
];

const DC = {
  "Hardware or Software": "#FF4ECD",
  "Investment":           "#4DA9FF",
  "Services":             "#00E5FF",
  "Venture Capital":      "#4BFF91",
};

const SC = {
  "Hyperscaler":    "#4DA9FF",
  "Chipmaker":      "#FF4ECD",
  "Foundation Lab": "#FFD54F",
  "AI Cloud":       "#4BFF91",
  "Robotics":       "#CE93D8",
  "Dev Tools":      "#FFB74D",
  "Vertical AI":    "#80DEEA",
  "Health AI":      "#A5D6A7",
  "Cloud/Infra":    "#EF9A9A",
};

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

function npos(n) {
  if (n.r === 0) return {x: CX, y: CY};
  const a = (n.angle - 90) * Math.PI / 180;
  return {x: CX + n.r * Math.cos(a), y: CY + n.r * Math.sin(a)};
}
function nrad(cap) { return Math.max(13, Math.min(63, 6 + Math.sqrt(cap) * 1.05)); }
function cpt(x1, y1, x2, y2) {
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const dx=mx-CX, dy=my-CY, len=Math.sqrt(dx*dx+dy*dy)||1;
  const pull = Math.min(88, Math.sqrt((x2-x1)**2+(y2-y1)**2)*0.38);
  return {cpx: mx+(dx/len)*pull, cpy: my+(dy/len)*pull};
}
function midpt(x1,y1,x2,y2) {
  const {cpx,cpy}=cpt(x1,y1,x2,y2), tt=0.72;
  return {x:(1-tt)**2*x1+2*(1-tt)*tt*cpx+tt**2*x2,
          y:(1-tt)**2*y1+2*(1-tt)*tt*cpy+tt**2*y2};
}

const svg = document.getElementById("net");

// defs + arrow markers
const defs = el("defs", {}, svg);
for (const [t, col] of Object.entries(DC)) {
  const id = "arr-" + t.replace(/ /g, "-");
  const mk = el("marker", {id, markerWidth:"7", markerHeight:"7", refX:"5.5", refY:"3.5", orient:"auto"}, defs);
  el("polygon", {points:"0 0,7 3.5,0 7", fill:col, opacity:"0.92"}, mk);
}

// guide rings
el("circle", {cx:CX,cy:CY,r:298,fill:"none",stroke:"#1B3A52","stroke-width":"1","stroke-dasharray":"4 8",opacity:"0.3"}, svg);
el("circle", {cx:CX,cy:CY,r:215,fill:"none",stroke:"#1B3A52","stroke-width":"0.5","stroke-dasharray":"3 12",opacity:"0.18"}, svg);

const positions = {};
NODES.forEach(n => { positions[n.id] = npos(n); });

let activeNode = null, activeFilter = null;

// tooltip layer (always on top)
const tipG = el("g", {"pointer-events":"none"}, svg);

// ── EDGES ──────────────────────────────────────────────
const edgeLayer = el("g", {}, svg);
const edgeEls = [];

EDGES.forEach((e, i) => {
  const s = positions[e.src], t = positions[e.tgt];
  if (!s || !t) return;
  const {cpx, cpy} = cpt(s.x, s.y, t.x, t.y);
  const d = `M${s.x},${s.y} Q${cpx},${cpy} ${t.x},${t.y}`;
  const col = DC[e.type];
  const mid = midpt(s.x, s.y, t.x, t.y);

  const g = el("g", {style:"cursor:pointer"}, edgeLayer);
  el("path", {d, fill:"none", stroke:"transparent", "stroke-width":"16"}, g);
  const line = el("path", {d, fill:"none", stroke:col,
    "stroke-width":"2",
    "stroke-opacity":"0.72",
    "stroke-dasharray": e.type === "Venture Capital" ? "6,4" : "none",
    "marker-end": `url(#arr-${e.type.replace(/ /g,"-")})`,
    style:"transition:stroke-opacity .18s,stroke-width .18s"}, g);

  const lbl = el("text", {x:mid.x, y:mid.y-11, "text-anchor":"middle",
    "font-size":"10.5", "font-weight":"700", fill:col, opacity:"0",
    style:"pointer-events:none;filter:drop-shadow(0 1px 3px #000)"}, g);
  lbl.textContent = e.label;

  edgeEls.push({g, line, lbl, e, col});

  g.addEventListener("mouseenter", () => {
    line.setAttribute("stroke-width", "3.8");
    line.setAttribute("stroke-opacity", "1");
    line.style.filter = `drop-shadow(0 0 6px ${col})`;
    lbl.setAttribute("opacity", "1");
  });
  g.addEventListener("mouseleave", () => {
    line.style.filter = "";
    lbl.setAttribute("opacity", "0");
    refresh();
  });
});

// ── NODES ──────────────────────────────────────────────
const nodeLayer = el("g", {}, svg);
const nodeEls = {};

NODES.forEach(n => {
  const {x, y} = positions[n.id];
  const r = nrad(n.cap);
  const col = SC[n.sector] || "#AAA";
  const ang = n.angle;

  let lx = x, ly = y + r + 15, ta = "middle";
  if      (ang > 30  && ang < 150) { lx = x;     ly = y - r - 15; ta = "middle"; }
  else if (ang >= 150 && ang < 210) { lx = x-r-8; ly = y;          ta = "end";    }
  else if (ang >= 330 || ang < 30)  { lx = x+r+8; ly = y;          ta = "start";  }
  if (n.r === 0) { lx = x; ly = y + r + 17; ta = "middle"; }

  const g = el("g", {style:"cursor:pointer"}, nodeLayer);
  const glow = el("circle", {cx:x,cy:y,r:r+10,fill:"none",stroke:col,
    "stroke-width":"1.5","stroke-opacity":"0.42",opacity:"0",
    style:`filter:drop-shadow(0 0 9px ${col})`}, g);
  const circle = el("circle", {cx:x,cy:y,r,fill:col+"1A",stroke:col,
    "stroke-width":"1.5",style:"transition:opacity .2s"}, g);
  if (r > 28) el("circle", {cx:x,cy:y,r:r*0.5,fill:col+"13",stroke:"none"}, g);

  const isBig = ["NVDA","OPENAI","MSFT"].includes(n.id);
  const txt = el("text", {x:lx,y:ly,"text-anchor":ta,
    "font-size":isBig?"11.5":"10.5","font-weight":"700",fill:col,
    style:"transition:opacity .2s;text-shadow:0 1px 5px #000,0 0 10px #000"}, g);
  txt.textContent = n.label;

  const sub = el("text", {x:lx,y:ly+14,"text-anchor":ta,
    "font-size":"9","font-weight":"500",fill:col,opacity:"0.6",
    style:"transition:opacity .2s"}, g);
  sub.textContent = n.sub;

  nodeEls[n.id] = {g, circle, glow, txt, sub, col, r, x, y, n};

  g.addEventListener("click", () => {
    activeNode = activeNode === n.id ? null : n.id;
    refresh();
    showTip(null);
    document.getElementById("clear-btn").style.display =
      (activeNode || activeFilter) ? "inline-block" : "none";
  });
  g.addEventListener("mouseenter", () => showTip(n.id));
  g.addEventListener("mouseleave", () => showTip(null));
});

svg.appendChild(tipG);

// ── TOOLTIP ────────────────────────────────────────────
function showTip(id) {
  while (tipG.firstChild) tipG.removeChild(tipG.firstChild);
  if (!id) return;
  const n = NODES.find(x => x.id === id);
  if (!n) return;
  const {x, y} = positions[id];
  const col = SC[n.sector] || "#AAA";
  const outs = EDGES.filter(e => e.src === id).slice(0, 4);
  const ins  = EDGES.filter(e => e.tgt === id).slice(0, 3);
  const h = 38 + outs.length * 14 + ins.length * 14 + 8;
  const tx = x > W * 0.67 ? x - 208 : x + 18;
  const ty = y > H * 0.72 ? y - h - 8 : y - 6;

  el("rect", {x:tx-5,y:ty-5,width:204,height:h,rx:"8",
    fill:"#0A1B2E",stroke:col,"stroke-width":"1.3",opacity:"0.97",
    style:"filter:drop-shadow(0 4px 20px #000)"}, tipG);

  const t1 = el("text", {x:tx+5,y:ty+14,"font-size":"12","font-weight":"800",fill:col}, tipG);
  t1.textContent = n.label;
  const t2 = el("text", {x:tx+5,y:ty+27,"font-size":"9.5",fill:"#7A9CB8"}, tipG);
  t2.textContent = n.sector + " · " + n.sub;

  outs.forEach((e, i) => {
    const t = el("text", {x:tx+5,y:ty+42+i*14,"font-size":"9.5",fill:"#4BFF91"}, tipG);
    t.textContent = "↗ " + e.tgt + ": " + e.label;
  });
  ins.forEach((e, i) => {
    const t = el("text", {x:tx+5,y:ty+42+outs.length*14+i*14,"font-size":"9.5",fill:"#4DA9FF"}, tipG);
    t.textContent = "↙ " + e.src + ": " + e.label;
  });
}

// ── REFRESH ────────────────────────────────────────────
function refresh() {
  edgeEls.forEach(({line, e, col}) => {
    const fm = !activeFilter || e.type === activeFilter;
    const nm = !activeNode  || (e.src === activeNode || e.tgt === activeNode);
    const show = fm && nm;
    line.setAttribute("stroke-opacity", show ? "0.75" : "0.07");
    line.setAttribute("stroke-width",   show ? "2"    : "0.5");
    if (show) line.setAttribute("marker-end", `url(#arr-${e.type.replace(/ /g,"-")})`);
    else      line.removeAttribute("marker-end");
  });
  Object.entries(nodeEls).forEach(([id, {circle, glow, txt, sub, col}]) => {
    const isAct  = activeNode === id;
    const isConn = activeNode && EDGES.some(e =>
      (e.src === activeNode || e.tgt === activeNode) && (e.src === id || e.tgt === id));
    const dim = activeNode && !isAct && !isConn;
    circle.setAttribute("opacity",      dim ? "0.14" : "1");
    txt.setAttribute("opacity",         dim ? "0.18" : "1");
    sub.setAttribute("opacity",         dim ? "0.08" : "0.6");
    glow.setAttribute("opacity",        isAct ? "1" : "0");
    circle.setAttribute("stroke-width", isAct ? "2.5" : "1.5");
    circle.style.filter = isAct ? `drop-shadow(0 0 10px ${col})` : "";
  });
}

// ── LEGEND BUTTONS ─────────────────────────────────────
const legEl = document.getElementById("legend");
Object.entries(DC).forEach(([t, col]) => {
  const btn = document.createElement("button");
  btn.className = "leg-btn";
  btn.style.border = `1.5px solid ${col}`;
  btn.style.color  = col;
  btn.dataset.type = t;
  btn.innerHTML = `<span class="leg-dash" style="background:${col};${t==="Venture Capital"?"border-top:2px dashed "+col+";background:transparent;":""}"></span>${t}`;
  btn.addEventListener("click", () => {
    activeFilter = activeFilter === t ? null : t;
    document.querySelectorAll(".leg-btn").forEach(b => {
      b.style.background = (activeFilter && b.dataset.type === activeFilter)
        ? DC[b.dataset.type] + "33" : "transparent";
    });
    const cb = document.getElementById("clear-btn");
    cb.style.display = (activeNode || activeFilter) ? "inline-block" : "none";
    refresh();
  });
  legEl.appendChild(btn);
});

const clearBtn = document.getElementById("clear-btn");
clearBtn.addEventListener("click", () => {
  activeFilter = null;
  activeNode   = null;
  document.querySelectorAll(".leg-btn").forEach(b => b.style.background = "transparent");
  clearBtn.style.display = "none";
  refresh();
});

// ── STATS BAR ──────────────────────────────────────────
const statsData = [
  {label:"Nvidia equity deployed (6mo)", val:"$90B+",   color:"#FF4ECD"},
  {label:"OpenAI vendor commitments",    val:"$1.15T+", color:"#FFD54F"},
  {label:"Feb 2026 VC record month",     val:"$189B",   color:"#4DA9FF"},
  {label:"OpenAI $110B round (record)",  val:"$110B",   color:"#4BFF91"},
];
const statsEl = document.getElementById("stats");
statsData.forEach(s => {
  const d = document.createElement("div");
  d.className = "stat-card";
  d.style.border = `1px solid ${s.color}33`;
  d.innerHTML = `<div class="stat-val" style="color:${s.color}">${s.val}</div>
                 <div class="stat-lbl">${s.label}</div>`;
  statsEl.appendChild(d);
});
</script>
</body>
</html>
