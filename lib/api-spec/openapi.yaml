openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: graph
    description: AI funding graph operations
  - name: manual
    description: Manually entered companies and deals
paths:
  /pipeline/status:
    get:
      operationId: getPipelineStatus
      tags: [graph]
      summary: Public ingestion, recovery, and source health
      responses:
        "200":
          description: Persisted pipeline telemetry and current graph counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineStatus"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /graph:
    get:
      operationId: getGraph
      tags: [graph]
      summary: Get the latest AI funding graph
      description: Returns the cached funding graph. RSS ingestion runs every 30 minutes while the service is running; extraction and recovery progress are exposed by /pipeline/status.
      responses:
        "200":
          description: Graph data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Graph"
  /graph/refresh:
    post:
      operationId: refreshGraph
      tags: [graph]
      summary: Trigger an async graph refresh
      description: Kicks off the RSS fetch + AI extraction pipeline in the background and returns immediately. Poll GET /graph/refresh/status to track progress.
      responses:
        "202":
          description: Refresh accepted and running in background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshAccepted"
  /graph/refresh/status:
    get:
      operationId: getRefreshStatus
      tags: [graph]
      summary: Poll the background refresh pipeline status
      description: Returns whether the pipeline is currently running and when it last completed successfully.
      responses:
        "200":
          description: Pipeline status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshStatus"
  /graph/backlog/process:
    post:
      operationId: startBacklogProcessing
      tags: [graph]
      summary: Start processing the full unprocessed-article backlog
      description: Kicks off a background job that repeatedly runs extraction batches until all unprocessed articles are handled. Poll GET /graph/backlog/status for progress.
      responses:
        "202":
          description: Backlog processing accepted and running in background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshAccepted"
  /graph/backlog/status:
    get:
      operationId: getBacklogStatus
      tags: [graph]
      summary: Poll the background backlog processing job status
      description: Returns progress of the backlog processing job (articles processed, deals found, remaining).
      responses:
        "200":
          description: Backlog job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklogStatus"
  /graph/summary:
    get:
      operationId: getGraphSummary
      tags: [graph]
      summary: Top-line summary stats for the graph
      description: Aggregate stats — total disclosed deal value, deal count, unique companies, breakdown by deal type, and the largest deals.
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphSummary"
  /graph/timeline:
    get:
      operationId: getGraphTimeline
      tags: [graph]
      summary: Chronological feed of deals
      description: Returns deals sorted by announcement date (most recent first) for a timeline / activity feed view.
      responses:
        "200":
          description: Timeline of deals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
  /manual/companies:
    get:
      operationId: listManualCompanies
      tags: [manual]
      summary: List manually-added companies
      responses:
        "200":
          description: List of manual companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualCompany"
    post:
      operationId: createManualCompany
      tags: [manual]
      summary: Add a company manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManualCompany"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualCompany"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /manual/companies/{id}:
    delete:
      operationId: deleteManualCompany
      tags: [manual]
      summary: Delete a manually-added company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /manual/deals:
    get:
      operationId: listManualDeals
      tags: [manual]
      summary: List manually-added deals
      responses:
        "200":
          description: List of manual deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualDeal"
    post:
      operationId: createManualDeal
      tags: [manual]
      summary: Add a deal manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManualDeal"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualDeal"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /manual/deals/{id}:
    delete:
      operationId: deleteManualDeal
      tags: [manual]
      summary: Delete a manually-added deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    FeedStatus:
      type: object
      required: [feedSource, outletName, ingested, accepted, displayed, lastRunIngested, lastError]
      properties:
        feedSource: { type: string }
        outletName: { type: string }
        ingested: { type: integer }
        accepted: { type: integer }
        displayed: { type: integer }
        lastRunIngested: { type: integer }
        lastError: { type: [string, "null"] }
    PipelineStatus:
      type: object
      required: [running, lastStartedAt, lastCompletedAt, lastError, lastRunIngested, awaitingExtraction, displayedEdges, hiddenDeadLink, hiddenOutOfWindow, hiddenOther, live, gated, dead, inconclusive, hidden, recovery, feeds, intervalMinutes]
      properties:
        running: { type: boolean }
        intervalMinutes: { type: integer }
        lastStartedAt: { type: [string, "null"] }
        lastCompletedAt: { type: [string, "null"] }
        lastError: { type: [string, "null"] }
        lastRunIngested: { type: integer }
        awaitingExtraction: { type: integer }
        displayedEdges: { type: integer }
        hiddenDeadLink: { type: integer }
        hiddenOutOfWindow: { type: integer }
        hiddenOther: { type: integer }
        live: { type: integer }
        gated: { type: integer }
        dead: { type: integer }
        inconclusive: { type: integer }
        hidden: { type: integer }
        recovery:
          $ref: "#/components/schemas/RecoveryStatus"
        feeds:
          type: array
          items:
            $ref: "#/components/schemas/FeedStatus"
    RecoveryStatus:
      type: object
      required: [startedAt, completedAt, totalArticles, processedArticles, orphanedFingerprints, restoredEdges, lastError]
      properties:
        startedAt: { type: [string, "null"] }
        completedAt: { type: [string, "null"] }
        totalArticles: { type: integer }
        processedArticles: { type: integer }
        orphanedFingerprints: { type: integer }
        restoredEdges: { type: integer }
        lastError: { type: [string, "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NodeSector:
      type: string
      enum:
        - tech
        - media
        - ai_lab
        - infrastructure
        - publisher
        - studio
        - investor
        - government
    GraphNode:
      type: object
      properties:
        id:
          type: string
          description: Stable kebab-case identifier
        name:
          type: string
        sector:
          $ref: "#/components/schemas/NodeSector"
        marketValueUsd:
          type: number
          nullable: true
          description: Approximate market cap or valuation in USD
        marketValueLabel:
          type: string
          description: Human-friendly market value label like "$4.5T" or "~$70B"
        description:
          type: string
          description: One-sentence description of the company
        country:
          type: string
          nullable: true
        isManual:
          type: boolean
          description: True if this node was manually added by a user
          default: false
      required:
        - id
        - name
        - sector
        - marketValueLabel
        - description
    DealType:
      type: string
      enum:
        - investment
        - acquisition
        - licensing
        - partnership
        - infrastructure
        - lawsuit
        - venture_capital
        - government_contract
        - government_subsidy
        - government_equity
        - ownership
    GraphEdge:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
          description: Source node id
        target:
          type: string
          description: Target node id
        dealType:
          $ref: "#/components/schemas/DealType"
        amountUsd:
          type: number
          nullable: true
          description: Disclosed deal amount in USD (null if undisclosed)
        amountLabel:
          type: string
          description: Human-friendly amount label like "$10B", "Multi-year", "Undisclosed"
        announcedAt:
          type: string
          description: ISO date when the deal was publicly announced
        headline:
          type: string
          description: Short headline of the deal
        description:
          type: string
          description: 1-2 sentence description of the deal
        sourceUrl:
          type: string
          nullable: true
          description: Primary source URL (first / best source)
        linkState:
          type: string
          enum: [live, gated, dead, inconclusive]
        evidenceSnippet:
          type: string
        feedSource:
          type: string
        sourceUrls:
          type: array
          nullable: true
          items:
            type: string
          description: All source URLs when multiple outlets covered this deal
        isManual:
          type: boolean
          description: True if this edge was manually added by a user
          default: false
        provenance:
          type: string
          enum:
            - seed
            - ai_extracted
            - manual
          description: How this deal entered the graph
        outletName:
          type: string
          nullable: true
          description: Primary outlet name
        outletNames:
          type: array
          nullable: true
          items:
            type: string
          description: All outlet names that reported this deal (when cross-referenced)
        isFoundational:
          type: boolean
          description: >
            True if this edge pre-dates the coverage window (before Oct 2025) or has no
            source URL. Shown on the map as structural context but excluded from the
            activity feed and deal counter. Togglable in the UI.
          default: false
      required:
        - id
        - source
        - target
        - dealType
        - amountLabel
        - announcedAt
        - headline
        - description
    GraphMeta:
      type: object
      properties:
        generatedAt:
          type: string
          description: ISO timestamp when this snapshot was generated
        nextRefreshAt:
          type: string
          description: ISO timestamp when the next automatic refresh will happen
        coveragePeriod:
          type: string
          description: Human-friendly coverage period like "Apr 2025 – Apr 2026"
        sources:
          type: array
          items:
            type: string
          description: Outlets / press releases the data is drawn from
      required:
        - generatedAt
        - nextRefreshAt
        - coveragePeriod
        - sources
    Graph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
        meta:
          $ref: "#/components/schemas/GraphMeta"
      required:
        - nodes
        - edges
        - meta
    DealTypeCount:
      type: object
      properties:
        dealType:
          $ref: "#/components/schemas/DealType"
        count:
          type: integer
        totalAmountUsd:
          type: number
      required:
        - dealType
        - count
        - totalAmountUsd
    SectorCount:
      type: object
      properties:
        sector:
          $ref: "#/components/schemas/NodeSector"
        count:
          type: integer
      required:
        - sector
        - count
    TopFlow:
      type: object
      properties:
        sourceName:
          type: string
        targetName:
          type: string
        dealType:
          $ref: "#/components/schemas/DealType"
        amountUsd:
          type: number
        amountLabel:
          type: string
        headline:
          type: string
        announcedAt:
          type: string
      required:
        - sourceName
        - targetName
        - dealType
        - amountLabel
        - headline
        - announcedAt
    GraphSummary:
      type: object
      properties:
        totalDeals:
          type: integer
        totalDisclosedUsd:
          type: number
        totalDisclosedLabel:
          type: string
        uniqueCompanies:
          type: integer
        techMediaDeals:
          type: integer
          description: Deals where one side is tech/ai_lab/infrastructure and the other is media/publisher/studio
        dealsByType:
          type: array
          items:
            $ref: "#/components/schemas/DealTypeCount"
        nodesBySector:
          type: array
          items:
            $ref: "#/components/schemas/SectorCount"
        topFlows:
          type: array
          items:
            $ref: "#/components/schemas/TopFlow"
        meta:
          $ref: "#/components/schemas/GraphMeta"
      required:
        - totalDeals
        - totalDisclosedUsd
        - totalDisclosedLabel
        - uniqueCompanies
        - techMediaDeals
        - dealsByType
        - nodesBySector
        - topFlows
        - meta
    TimelineItem:
      type: object
      properties:
        id:
          type: string
        sourceName:
          type: string
        targetName:
          type: string
        dealType:
          $ref: "#/components/schemas/DealType"
        amountLabel:
          type: string
        headline:
          type: string
        description:
          type: string
        announcedAt:
          type: string
        sourceUrl:
          type: string
          nullable: true
      required:
        - id
        - sourceName
        - targetName
        - dealType
        - amountLabel
        - headline
        - description
        - announcedAt
        - sourceUrl
    Timeline:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TimelineItem"
        meta:
          $ref: "#/components/schemas/GraphMeta"
      required:
        - items
        - meta
    ManualCompany:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sector:
          $ref: "#/components/schemas/NodeSector"
        description:
          type: string
        marketValueUsd:
          type: number
          nullable: true
        marketValueLabel:
          type: string
        country:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - name
        - sector
        - description
        - marketValueLabel
        - createdAt
    CreateManualCompany:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        sector:
          $ref: "#/components/schemas/NodeSector"
        description:
          type: string
        marketValueUsd:
          type: number
          nullable: true
        marketValueLabel:
          type: string
          minLength: 1
        country:
          type: string
          nullable: true
      required:
        - name
        - sector
        - marketValueLabel
    ManualDeal:
      type: object
      properties:
        id:
          type: string
        sourceId:
          type: string
        targetId:
          type: string
        dealType:
          $ref: "#/components/schemas/DealType"
        amountUsd:
          type: number
          nullable: true
        amountLabel:
          type: string
        announcedAt:
          type: string
        headline:
          type: string
        description:
          type: string
        sourceUrl:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - sourceId
        - targetId
        - dealType
        - amountLabel
        - announcedAt
        - headline
        - description
        - createdAt
    CreateManualDeal:
      type: object
      properties:
        sourceId:
          type: string
          minLength: 1
        targetId:
          type: string
          minLength: 1
        dealType:
          $ref: "#/components/schemas/DealType"
        amountUsd:
          type: number
          nullable: true
        amountLabel:
          type: string
          minLength: 1
        announcedAt:
          type: string
          minLength: 1
        headline:
          type: string
          minLength: 1
        description:
          type: string
        sourceUrl:
          type: string
          nullable: true
      required:
        - sourceId
        - targetId
        - dealType
        - amountLabel
        - announcedAt
        - headline
    RefreshAccepted:
      type: object
      properties:
        status:
          type: string
          enum: [accepted, already_running]
        message:
          type: string
      required:
        - status
        - message
    RefreshStatus:
      type: object
      properties:
        running:
          type: boolean
        lastCompletedAt:
          type: string
          nullable: true
      required:
        - running
        - lastCompletedAt
    BacklogStatus:
      type: object
      properties:
        running:
          type: boolean
        totalUnprocessed:
          type: integer
        processed:
          type: integer
        dealsFound:
          type: integer
        startedAt:
          type: string
          nullable: true
        completedAt:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
      required:
        - running
        - totalUnprocessed
        - processed
        - dealsFound
        - startedAt
        - completedAt
        - lastError
    ApiError:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          nullable: true
          items:
            type: string
      required:
        - error
